        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: admin-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-insights-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-insights.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-insights.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-insights.sql
