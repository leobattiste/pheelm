# On every push and pull request: build the site and run the smoke checks in tests/smoke.mjs.
name: Smoke checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium webkit
      - run: npm run test:security
      - run: node tests/film-submissions.mjs
      - run: node tests/catalog-search.mjs
      - run: npm run build
      - run: npx next start -p 3000 & npx wait-on -t 60000 http://localhost:3000
      - run: npm run test:smoke
      - run: node tests/catalog-search-browser.mjs
        env:
          BASE_URL: http://localhost:3000
      - run: node tests/catalog-search-browser.mjs
        env:
          BASE_URL: http://localhost:3000
          BROWSER: webkit
