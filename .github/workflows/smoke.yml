      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-inbox-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-inbox.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-inbox.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-inbox.sql

  admin-community-database:
