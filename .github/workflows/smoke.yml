# On every push and pull request: build the site and run the smoke checks in tests/smoke.mjs.
name: Smoke checks
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium webkit
      - run: npm run test:security
      - run: node tests/site-seo.mjs
      - run: node tests/watchlist-urls.mjs
      - run: node tests/profile-bio.mjs
      - run: node tests/profile-seo.mjs
      - run: node tests/profile-loading.mjs
      - run: node tests/partnership-inquiry.mjs
      - run: node tests/admin-create-person.mjs
      - run: node tests/admin-import-selected.mjs
      - run: node tests/admin-permissions.mjs
      - run: node tests/admin-responsive.mjs
      - run: node tests/bulk-import-grid-browser.mjs
      - run: npm run email:preview
      - run: node scripts/export-auth-emails.mjs
      - run: node tests/email-security.mjs
      - run: node tests/film-submissions.mjs
      - run: node tests/catalog-search.mjs
      - run: npm run build
      - run: npx next start -p 3000 & npx wait-on -t 60000 http://localhost:3000
      - run: node tests/site-seo-browser.mjs
      - run: npm run test:smoke
      - run: node tests/catalog-search-browser.mjs
        env:
          BASE_URL: http://localhost:3000
      - run: node tests/watchlist-mobile.mjs
      - run: node tests/profile-forms-browser.mjs
      - run: node tests/profile-about-browser.mjs
      - run: node tests/tabs-browser.mjs
      - run: node tests/admin-catalog-toolbar-browser.mjs
      - run: node tests/admin-catalog-toolbar-browser.mjs
        env:
          BROWSER: webkit
      - run: node tests/films-shuffle-browser.mjs
        env:
          BASE_URL: http://localhost:3000
      - run: node tests/catalog-search-browser.mjs
        env:
          BASE_URL: http://localhost:3000
          BROWSER: webkit

  email-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: email-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: email-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/email-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/email-system.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/email-system.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/catalog-digest-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/catalog-digest.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/catalog-digest.sql

  profile-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: profile-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: profile-test-only
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/profile-about-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/profile-about.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/leo-bio.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/profile-about.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/leo-bio.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/watchlist-slugs-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/watchlist-slugs.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/watchlist-slug-normalization.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/watchlist-slugs.sql

  admin-database:
