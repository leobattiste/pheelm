    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-community-bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-community.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/admin-community.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/admin-community.sql

  film-comments-database:
